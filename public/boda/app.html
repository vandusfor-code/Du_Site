<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Invitación de boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/boda/css/invitacion.css">
<link rel="stylesheet" href="/boda/css/panel.css">
<style>
  html{scroll-behavior:smooth}
  body{margin:0;background:#ececec}
  body.modo-panel{background:#f5f4ef}
  .dlg{position:fixed;inset:0;z-index:9500;display:grid;place-items:center;padding:20px;background:rgba(15,15,15,.5);font-family:system-ui,sans-serif}
  .dlg-c{width:min(100%,400px);background:#fff;border-radius:16px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .dlg-c h3{margin:0 0 12px;font-size:1.15rem}
  .dlg-b{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .dlg-c input{width:100%;padding:11px 12px;border:1.5px solid #e2e0d6;border-radius:10px;font:inherit;box-sizing:border-box}
  .dlg-c .f{display:block;margin-bottom:12px}.dlg-c .f>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  .dlg-c .btn{display:inline-flex;padding:10px 16px;border-radius:10px;border:1.5px solid #53582f;background:#fff;color:#53582f;font:700 .93rem system-ui;cursor:pointer}
  .dlg-c .btn.pri{background:#53582f;color:#fff}.dlg-c .btn.sec{border-color:#e2e0d6;color:#232323}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/boda/js/main.js"></script>
</body>
</html>
